name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.11 is the floor declared in pyproject; 3.13 is what development
        # uses. Testing both stops a 3.13-only idiom reaching a customer who
        # is pinned lower.
        python: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install (core only — no cloud SDKs)
        # Deliberate: the suite must pass with none of boto3/kubernetes/azure/
        # gcp installed. That is what proves every provider adapter really does
        # import its SDK lazily, which in turn is what lets the container ship
        # without the ability to touch a cloud it was not given.
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Assert no cloud SDK leaked into the environment
        run: |
          python - <<'EOF'
          import importlib.util, sys

          def present(name: str) -> bool:
              # find_spec raises ModuleNotFoundError for a dotted name whose
              # PARENT is missing, rather than returning None — so the naive
              # version of this check failed precisely when the SDK was absent,
              # which is the state it exists to confirm.
              try:
                  return importlib.util.find_spec(name) is not None
              except (ModuleNotFoundError, ImportError, ValueError):
                  return False

          leaked = [m for m in ("boto3", "kubernetes", "azure", "google.cloud.compute")
                    if present(m)]
          if leaked:
              sys.exit(f"cloud SDKs present in a core install: {leaked}")
          print("clean: no cloud SDKs installed")
          EOF

      - name: Test
        run: pytest -q

  test-full:
    # The core job above proves the lazy-import guarantee by running with no
    # cloud SDKs at all — but that means the AWS containment tests skip. This
    # job installs everything so those actually execute; between the two, both
    # the guarantee and the code it protects are covered.
    name: tests (all extras)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install ".[all,dev,test-aws]"
      - name: Test, and fail if the AWS paths silently skipped
        run: |
          pytest -q -rs | tee /tmp/out
          if grep -qE 'skipped.*(boto3|moto)' /tmp/out; then
            echo "AWS tests skipped in the all-extras job — the SDK did not install"
            exit 1
          fi

  eval:
    # The measured-accuracy regression gate. The unit suite proves the pipeline
    # behaves correctly on the cases it was written for; this scores it against
    # a labeled dataset and fails the build if the whole-pipeline containment
    # decision degrades.
    #
    # It gates CDC (containment-decision correctness) and FPUA (benign findings
    # that led to autonomous action), NOT triage F1. The offline mock answers
    # triage with the dataset's own labels, so F1 is ~100% by construction and
    # would be a check that cannot fail — see the gate in run_eval.py. CDC and
    # FPUA score the deterministic policy path, which the mock does not supply,
    # and were mutation-tested: breaking the auto-execute route drops CDC from
    # 100% to 60% and fails this job.
    name: evaluation gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"
      - name: Score the pipeline against the labeled dataset
        # No API key: the harness runs offline against the mock by default, so
        # this job is deterministic and costs nothing per run.
        run: python run_eval.py

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install ruff import-linter
      - run: ruff check .

      - name: Architecture contracts
        # Kronagent's central claim is that a model can influence whether
        # containment proceeds but never what it targets. The behavioural tests
        # check that; these contracts stop the *shape* of the code drifting
        # away from it — an agent module gaining an import of the containment
        # executor would pass every existing test.
        run: lint-imports

  templates:
    name: cloudformation templates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: pip install ".[dev]"

      - name: Committed IAM artifacts match the renderer
        # deploy/cloudformation/*.json and deploy/kronagent-iam-policy.json are
        # generated from kronagent/connect.py. Maintained by hand they drifted
        # four ways, including a contain role that pinned an inline policy name
        # the adapter never writes — granted, denied, and invisible to any check
        # that compared action names.
        run: python3 deploy/publish_templates.py --check

      - name: Templates are valid CloudFormation
        # Renders as valid JSON is not the same as CloudFormation will accept
        # it. cfn-lint needs no AWS credentials.
        run: |
          pip install cfn-lint
          cfn-lint deploy/cloudformation/*.json

      - name: The two template forms grant the same thing
        run: pytest -q tests/test_deploy_templates_match_render.py

  build:
    name: container image
    runs-on: ubuntu-latest
    needs: [test]
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        # Plain `docker build`, deliberately, rather than buildx via
        # setup-buildx-action. The docker-container driver has to pull
        # moby/buildkit from Docker Hub before it can build anything, and
        # GitHub's runners share source IPs against Docker Hub's anonymous
        # rate limit. On 2026-07-31 that step failed on main with
        # `registry-1.docker.io: context deadline exceeded` after every test
        # job had passed — an infrastructure flake reported as a build failure.
        #
        # The daemon's built-in BuildKit needs no such pull, which removes one
        # of the two Docker Hub round-trips. The other — the python:3.13-slim
        # base image — is unavoidable, so the build is retried with backoff.
        # Losing `cache-to: type=gha` costs roughly 30s on a cold build and is
        # worth it to stop a green test suite being reported as a red build.
        run: |
          for attempt in 1 2 3; do
            if docker build --tag kronagent:ci .; then
              echo "built on attempt $attempt"
              exit 0
            fi
            echo "build attempt $attempt failed; retrying in $((attempt * 20))s"
            sleep $((attempt * 20))
          done
          echo "image build failed three times — not a flake"
          exit 1

      - name: Image runs as non-root
        run: |
          uid=$(docker run --rm --entrypoint id kronagent:ci -u)
          echo "container uid: $uid"
          [ "$uid" != "0" ] || { echo "image runs as root"; exit 1; }

      - name: Image starts and serves /api/status
        run: |
          docker run -d --name kronagent-ci -p 8000:8000 kronagent:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/status >/dev/null 2>&1; then
              echo "console answered after ${i}s"
              curl -sS http://127.0.0.1:8000/api/status
              docker rm -f kronagent-ci >/dev/null
              exit 0
            fi
            sleep 1
          done
          echo "console never answered:"
          docker logs kronagent-ci
          docker rm -f kronagent-ci >/dev/null
          exit 1

      - name: The agent loop runs in the image and writes to the volume
        # The default CMD starts the loop only when a live source exists, so
        # replay the samples here: /api/status must answer AND the audit chain
        # must appear in the state volume, verified, in dry-run.
        run: |
          docker run -d --name kronagent-loop kronagent:ci \
            kronagent-serve --host 0.0.0.0 --port 8000 --replay
          for i in $(seq 1 60); do
            if docker exec kronagent-loop python -c "
          import sys
          from kronagent.audit import AuditLog
          from kronagent.config import Settings
          s = Settings.from_env()
          assert s.audit_log_path.startswith('/var/lib/kronagent/'), s.audit_log_path
          ok, broken = AuditLog.verify(s.audit_log_path)
          n = len(AuditLog.read_records(s.audit_log_path))
          sys.exit(0 if ok and n > 0 else 1)
          " 2>/dev/null; then
              echo "audit chain written and verified after ${i}s"
              docker exec kronagent-loop python -c "import urllib.request; print(urllib.request.urlopen('http://127.0.0.1:8000/api/status').read().decode())"
              docker rm -f kronagent-loop >/dev/null
              exit 0
            fi
            sleep 1
          done
          echo "the agent loop never wrote a verified audit chain:"
          docker logs kronagent-loop
          docker rm -f kronagent-loop >/dev/null
          exit 1

      - name: Dry-run is the default posture
        # A container that ships with containment armed would be a defect, so
        # assert the shipped default rather than trusting the Dockerfile ENV.
        run: |
          out=$(docker run --rm --entrypoint python kronagent:ci -c \
            "from kronagent.config import Settings; print(Settings.from_env().dry_run)")
          echo "dry_run default: $out"
          [ "$out" = "True" ] || { echo "image does not default to dry-run"; exit 1; }
